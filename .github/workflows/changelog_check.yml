name: Changelog Pflicht

# Runs on EVERY pull request, deliberately. This job is a required check on
# main, and a required check that is filtered out by path never reports at
# all — it sits as "expected" forever and the pull request can only be merged
# by an administrator overriding the protection. That is what happened to
# every docs-only and CI-only pull request in this repo. The rule itself has
# not changed: the job decides for itself whether the rule applies, and says
# so, instead of the trigger deciding whether anyone hears from it.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: CHANGELOG.md aktualisiert?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for git diff origin/main...HEAD

      - name: Prüfen ob CHANGELOG.md geändert wurde
        run: |
          FILES=$(git diff --name-only origin/main...HEAD)
          if ! echo "$FILES" | grep -qE '^(custom_components/|CHANGELOG\.md$)'; then
            echo "Kein Integrations-Code geändert (nur Doku/CI/Tests) — CHANGELOG-Pflicht gilt hier nicht."
            exit 0
          fi
          if ! echo "$FILES" | grep -q "CHANGELOG.md"; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  CHANGELOG.md wurde nicht aktualisiert!"
            echo "══════════════════════════════════════════"
            echo ""
            echo "Bitte trage deine Änderungen im Unreleased-Block ein:"
            echo ""
            echo "  ## [Unreleased]"
            echo "  ### Hinzugefügt / Geändert / Behoben"
            echo "  - Beschreibung der Änderung"
            echo "    Autor: @dein-name"
            echo ""
            exit 1
          fi
          echo "CHANGELOG.md wurde aktualisiert — OK"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The step above asks whether CHANGELOG.md was *touched*. That is a
      # different question from whether the result is intact, and twice in one
      # day the difference cost an entry: a merge left "### Behoben / Fixed" in
      # the Unreleased block twice, and a conflict resolution dropped main's
      # whole "### Hinzugefügt / Added" section. Both times the file WAS
      # modified, so the step above passed it.
      #
      # --base origin/main compares against main's current changelog, and on a
      # pull_request event actions/checkout gives us the MERGE commit — so what
      # is compared is the merged result, which is where both failures showed up.
      # The script refuses (exit 2) if that ref cannot be read, rather than
      # quietly dropping the lost-entry check in a job nobody reads when it passes.
      - name: CHANGELOG-Struktur prüfen (Dubletten, Marker, verlorene Einträge)
        run: python scripts/check_changelog_structure.py --base origin/main
